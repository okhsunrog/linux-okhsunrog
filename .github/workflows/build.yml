name: build kernel

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
  workflow_dispatch:
    inputs:
      enforce_signatures:
        description: Require signed modules and kexec images, with integrity lockdown
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    timeout-minutes: 350

    steps:
      - name: Free up disk space on the host
        run: |
          # ubuntu-latest gives ~14GB free; kernel + zfs + thin-LTO needs more.
          # Inside the arch container we can't touch the host FS; this step is a no-op
          # placeholder kept for clarity. If we OOM on disk, switch to a self-hosted runner
          # or use jlumbroso/free-disk-space before starting the container.
          df -h

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git sudo ccache \
            bc binutils cpio gettext glibc libelf libgcc openssl pahole perl python uv \
            rustup rust-bindgen tar xxhash xz zlib zstd \
            clang llvm lld qemu-system-x86 busybox kexec-tools keyutils attr \
            autoconf automake libtool sbsigntools

      - uses: actions/checkout@v4

      - name: Set up unprivileged build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - name: Install pinned Rust toolchain
        # The pin lives in the PKGBUILD (_rust_toolchain); rustup dist
        # toolchains are bit-identical everywhere, so external modules built
        # on any machine with the same pin match the kernel's crate metadata.
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^: "\${_rust_toolchain:=\(.*\)}"$/\1/p' PKGBUILD)
          test -n "$toolchain"
          sudo -u builder rustup toolchain install "$toolchain" \
            --profile minimal -c rust-src -c rustfmt

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/builder/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('PKGBUILD','config') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          mkdir -p /home/builder/.ccache
          chown -R builder:builder /home/builder/.ccache
          sudo -u builder ccache -M 5G
          sudo -u builder ccache -z

      - name: Build kernel packages
        # NOTE: _processor_opt=meteorlake injects -march=meteorlake -mtune=meteorlake
        # via KCFLAGS so the kernel is tuned for the *target* CPU (the dev's MTL laptop),
        # not for whichever runner happens to host this job. Identical to a local
        # _processor_opt=native build on a Meteor Lake host.
        run: |
          secureboot_enforce=no
          if [[ '${{ inputs.enforce_signatures }}' == 'true' ]]; then
            secureboot_enforce=yes
          fi
          sudo -u builder env \
            CCACHE_DIR=/home/builder/.ccache \
            PATH=/usr/lib/ccache/bin:$PATH \
            _compiler=llvm \
            _use_llvm_lto=none \
            _processor_opt=meteorlake \
            _secureboot_cert=secureboot-trusted.pem \
            _secureboot_enforce="$secureboot_enforce" \
            makepkg -s --noconfirm --noprogressbar

      - name: Verify Rust external module development support
        run: |
          set -euo pipefail
          source_dir="$(find src -mindepth 1 -maxdepth 1 -type d -name 'cachyos-*' -print -quit)"
          grep -qx 'CONFIG_RUST=y' "$source_dir/.config"
          grep -qx 'CONFIG_LTO_NONE=y' "$source_dir/.config"
          test -s "$source_dir/rust/libkernel.rmeta"

          # The kernel must have been built by the pinned rustup toolchain,
          # not a distro rustc (whose version suffix poisons the rmeta).
          grep '^CONFIG_RUSTC_VERSION_TEXT' "$source_dir/.config"
          ! grep '^CONFIG_RUSTC_VERSION_TEXT.*Arch Linux' "$source_dir/.config"

          headers_pkg="$(find . -maxdepth 1 -type f -name '*-headers-*.pkg.tar.zst' -print -quit)"
          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT
          bsdtar -xf "$headers_pkg" -C "$test_root"
          kernel_dir="$(find "$test_root/usr/lib/modules" -mindepth 2 -maxdepth 2 -type d -name build -print -quit)"
          test -s "$kernel_dir/rust/libkernel.rmeta"
          test -f "$kernel_dir/rust/Makefile"

          module_dir="$test_root/rust-module"
          mkdir "$module_dir"
          cp "$source_dir/samples/rust/rust_minimal.rs" "$module_dir/"
          printf 'obj-m := rust_minimal.o\n' > "$module_dir/Kbuild"
          # This step runs as root, which has no rustup toolchains; resolve
          # the pinned rustc from the builder user's rustup.
          toolchain=$(sed -n 's/^: "\${_rust_toolchain:=\(.*\)}"$/\1/p' PKGBUILD)
          rustc_path=$(sudo -u builder rustup which --toolchain "$toolchain" rustc)
          make -C "$kernel_dir" M="$module_dir" LLVM=1 RUSTC="$rustc_path"
          make -C "$kernel_dir" M="$module_dir" LLVM=1 RUSTC="$rustc_path" rust-analyzer
          find "$module_dir" "$kernel_dir" -name rust-project.json -type f -size +0c -print -quit | grep -q .

      - name: Verify Secure Boot support remains available
        run: |
          set -euo pipefail
          source_dir="$(find src -mindepth 1 -maxdepth 1 -type d -name 'cachyos-*' -print -quit)"
          for option in EFI EFI_STUB KEXEC_FILE KEXEC_SIG KEXEC_BZIMAGE_VERIFY_SIG \
            SECURITY_LOCKDOWN_LSM INTEGRITY_PLATFORM_KEYRING \
            SYSTEM_TRUSTED_KEYRING SECONDARY_TRUSTED_KEYRING MODULE_SIG \
            IMA IMA_APPRAISE IMA_READ_POLICY IMA_LOAD_X509 IMA_ARCH_POLICY \
            IMA_KEYRINGS_PERMIT_SIGNED_BY_BUILTIN_OR_SECONDARY; do
            grep -qx "CONFIG_${option}=y" "$source_dir/.config"
          done
          grep -q '^CONFIG_LSM="\([^" ]*,\)\?ima\(,[^" ]*\)\?"$' "$source_dir/.config"
          grep -qx 'CONFIG_IMA_DEFAULT_HASH="sha256"' "$source_dir/.config"
          grep -qx 'CONFIG_SYSTEM_TRUSTED_KEYS="certs/secureboot-trusted.pem"' "$source_dir/.config"
          cmp secureboot-trusted.pem "$source_dir/certs/secureboot-trusted.pem"
          uv run --no-project python - "$source_dir/certs/x509_certificate_list" <<'PY'
          import pathlib, re, subprocess, sys
          compiled = pathlib.Path(sys.argv[1]).read_bytes()
          pem = pathlib.Path('secureboot-trusted.pem').read_bytes()
          assert b'PRIVATE KEY' not in pem
          certs = re.findall(rb'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----', pem, re.S)
          assert len(certs) == 3
          for cert in certs:
              der = subprocess.check_output(['openssl', 'x509', '-outform', 'DER'], input=cert)
              assert der in compiled, 'Trusted certificate missing from compiled kernel certificate list'
          PY
          if [[ '${{ inputs.enforce_signatures }}' == 'true' ]]; then
            for option in KEXEC_SIG_FORCE MODULE_SIG_FORCE SECURITY_LOCKDOWN_LSM_EARLY LOCK_DOWN_KERNEL_FORCE_INTEGRITY; do
              grep -qx "CONFIG_${option}=y" "$source_dir/.config"
            done
          else
            grep -qx 'CONFIG_LOCK_DOWN_KERNEL_FORCE_NONE=y' "$source_dir/.config"
            ! grep -qx 'CONFIG_KEXEC_SIG_FORCE=y' "$source_dir/.config"
            ! grep -qx 'CONFIG_MODULE_SIG_FORCE=y' "$source_dir/.config"
          fi

      - name: Test IMA initramfs appraisal and kexec in QEMU
        run: |
          set -euo pipefail
          source_dir="$(find src -mindepth 1 -maxdepth 1 -type d -name 'cachyos-*' -print -quit)"
          bash tests/build-evmctl.sh /tmp/ima-evm-utils
          openssl x509 -inform DER -in "$source_dir/certs/signing_key.x509" -out /tmp/ima-build-cert.pem
          bash tests/ima-xattr.sh /tmp/ima-evm-utils/src/evmctl "$source_dir/certs/signing_key.pem" /tmp/ima-build-cert.pem "$source_dir/certs/signing_key.x509"
          bash tests/ima-kexec.sh "$source_dir" /tmp/ima-evm-utils/src/evmctl

      - name: ccache stats
        if: always()
        run: sudo -u builder ccache -s

      - name: Upload packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-okhsunrog-pkgs
          path: '*.pkg.tar.zst'
          if-no-files-found: error
          retention-days: 14

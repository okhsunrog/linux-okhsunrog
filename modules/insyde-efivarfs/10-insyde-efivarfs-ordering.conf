[Unit]
# efivarfs is mounted by PID 1 before units start. Restore its view before
# udev discovers the TPM and before any measured-OS TPM service evaluates it.
Before=systemd-udevd.service systemd-udev-trigger.service tpm2.target
# tpm2-generator may omit the target when the built-in driver already exists.
# Order the early condition checks directly, too.
Before=systemd-tpm2-setup-early.service systemd-tpm2-setup.service
Before=systemd-pcrphase-initrd.service systemd-pcrosseparator.service
# This configuration belongs to the Framework with a confirmed hardware TPM.
# Pull its synchronization target even when the built-in driver is present,
# so setup waits for udev (and the local NvPCR workaround) to initialize it.
Wants=tpm2.target
# These early socket conditions can also cache the measured-OS/UKI result.
Before=systemd-pcrextend.socket systemd-pcrlock.socket systemd-report-sign-tpm2.socket
